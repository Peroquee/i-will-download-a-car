<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>youtube-premium</title>
  <link id="favicon" rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="vpn" class="vpn-bar vpn-unknown" role="status">
  <span class="vpn-dot" aria-hidden="true"></span>
  <span class="vpn-main"><strong id="vpn-text" data-i18n="vpn.unknown"></strong><span id="vpn-detail" class="vpn-detail"></span></span>
</div>
<div class="wrap">
  <main class="card" aria-labelledby="title">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="38" rx="16" ry="15" fill="#dba876"/>
          <path d="M14 30 C14 15 22 9 32 9 C42 9 50 15 50 30 C50 21 42 19 32 19 C22 19 14 21 14 30 Z" fill="#a4372f"/>
          <path d="M45 19 L58 12 L53 25 Z" fill="#a4372f"/>
          <circle cx="25" cy="16" r="1.4" fill="#f2e6c9"/>
          <circle cx="32" cy="13.5" r="1.4" fill="#f2e6c9"/>
          <circle cx="39" cy="16" r="1.4" fill="#f2e6c9"/>
          <path d="M11 31 L53 35" stroke="#171310" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="25.5" cy="34.5" rx="5.5" ry="4.5" fill="#171310"/>
          <circle cx="41" cy="35" r="2.3" fill="#171310"/>
          <path d="M35.5 31.5 Q41 29.5 45 32" stroke="#171310" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M22 45 C26 41 29.5 46.5 32 44.5 C34.5 46.5 38 41 42 45 C39.5 49.5 34.5 47 32 48 C29.5 47 24.5 49.5 22 45 Z" fill="#2a1c10"/>
        </svg>
      </div>
      <div class="titles">
        <h1 id="title" class="title">youtube-premium</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
      <div class="tools">
        <button type="button" id="howto-open" class="howto-button" aria-haspopup="dialog" data-i18n="howto.button"></button>
        <button type="button" id="lang" class="ghost small" aria-label="Language / Sprache">DE</button>
      </div>
    </header>

    <form id="form" autocomplete="off" novalidate>
      <div class="row">
        <label class="field" for="link" data-i18n="link.label"></label>
        <input id="link" name="link" type="text" inputmode="url" spellcheck="false"
               autocapitalize="off" autocorrect="off" data-i18n-placeholder="link.placeholder"
               aria-describedby="link-note link-error">
        <p id="link-note" class="note" data-i18n="link.note"></p>
        <p id="link-error" class="error" role="alert"></p>
      </div>

      <fieldset class="row mode" aria-labelledby="mode-label">
        <legend id="mode-label" class="field" data-i18n="mode.label"></legend>
        <div class="segmented">
          <input type="radio" name="mode" id="mode-youtube" value="youtube" checked>
          <label for="mode-youtube" data-i18n="mode.youtube"></label>
          <input type="radio" name="mode" id="mode-magnet" value="magnet">
          <label for="mode-magnet" data-i18n="mode.magnet"></label>
          <input type="radio" name="mode" id="mode-podcast" value="podcast">
          <label for="mode-podcast" data-i18n="mode.podcast"></label>
        </div>
      </fieldset>

      <section id="youtube-fields" class="panel" aria-live="polite">
        <p id="probe-status" class="note"></p>
        <div class="row">
          <label class="field" for="yt-target" data-i18n="yt.target"></label>
          <select id="yt-target" name="target">
            <option value="video" data-i18n="yt.target_video"></option>
            <option value="podcast" data-i18n="yt.target_podcast"></option>
            <option value="music" data-i18n="yt.target_music"></option>
          </select>
        </div>
        <div id="yt-audio-row" hidden>
          <label class="checkbox" for="yt-audio">
            <input id="yt-audio" type="checkbox">
            <span data-i18n="yt.audio"></span>
          </label>
          <p class="note" data-i18n="yt.audio_note"></p>
        </div>
        <div class="row">
          <label class="field" id="yt-channel-label" for="f-channel" data-i18n="yt.channel"></label>
          <input id="f-channel" name="channel" type="text" maxlength="200" aria-describedby="f-channel-error">
          <p id="f-channel-error" class="error" role="alert"></p>
        </div>
        <div class="row">
          <label class="field" id="yt-title-label" for="f-yt-title" data-i18n="yt.title"></label>
          <input id="f-yt-title" name="title" type="text" maxlength="200" aria-describedby="f-yt-title-error">
          <p id="f-yt-title-error" class="error" role="alert"></p>
        </div>
        <div id="yt-album-row" class="row" hidden>
          <label class="field" for="f-yt-album" data-i18n="yt.album"></label>
          <input id="f-yt-album" name="album" type="text" maxlength="200" aria-describedby="f-yt-album-error">
          <p class="note" data-i18n="yt.album_note"></p>
          <p id="f-yt-album-error" class="error" role="alert"></p>
        </div>
        <p id="probe-duration" class="note"></p>
        <div id="yt-subscribe-row">
          <label class="checkbox" for="subscribe">
            <input id="subscribe" type="checkbox">
            <span data-i18n="yt.subscribe"></span>
          </label>
          <p id="yt-subscribe-note" class="note" data-i18n="yt.subscribe_note"></p>
        </div>
      </section>

      <section id="podcast-fields" class="panel" aria-live="polite" hidden>
        <p id="pc-status" class="note"></p>
        <div class="row">
          <label class="field" for="f-podcast" data-i18n="pc.folder"></label>
          <input id="f-podcast" name="podcast" type="text" maxlength="200" aria-describedby="f-podcast-error">
          <p id="f-podcast-error" class="error" role="alert"></p>
        </div>
        <div class="row">
          <label class="field" for="pc-episode" data-i18n="pc.episode"></label>
          <select id="pc-episode" name="episode" aria-describedby="pc-episode-error">
            <option value="" data-i18n="pc.none"></option>
          </select>
          <p id="pc-episode-error" class="error" role="alert"></p>
        </div>
        <label class="checkbox" for="pc-subscribe">
          <input id="pc-subscribe" type="checkbox">
          <span data-i18n="pc.subscribe"></span>
        </label>
        <p class="note" data-i18n="pc.subscribe_note"></p>
        <div class="row">
          <label class="field" for="pc-backfill" data-i18n="pc.backfill"></label>
          <input id="pc-backfill" type="text" inputmode="numeric" maxlength="2" value="0" aria-describedby="pc-backfill-error">
          <p id="pc-backfill-error" class="error" role="alert"></p>
        </div>
      </section>

      <section id="magnet-fields" class="panel" hidden>
        <div class="row">
          <label class="field" for="media-type" data-i18n="mg.type"></label>
          <select id="media-type" name="media-type">
            <option value="movies" data-i18n="type.movies"></option>
            <option value="series" data-i18n="type.series"></option>
            <option value="audiobooks" data-i18n="type.audiobooks"></option>
            <option value="music" data-i18n="type.music"></option>
          </select>
        </div>

        <div class="type-fields" data-type="movies">
          <div class="row">
            <label class="field" for="f-movie-title" data-i18n="field.title"></label>
            <input id="f-movie-title" type="text" maxlength="200" data-field="title" aria-describedby="f-movie-title-error">
            <p id="f-movie-title-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-year" data-i18n="field.year"></label>
            <input id="f-year" type="text" inputmode="numeric" maxlength="4" data-field="year" aria-describedby="f-year-error">
            <p id="f-year-error" class="error" role="alert"></p>
          </div>
        </div>

        <div class="type-fields" data-type="series" hidden>
          <div class="row">
            <label class="field" for="f-series-title" data-i18n="field.show"></label>
            <input id="f-series-title" type="text" maxlength="200" data-field="title" aria-describedby="f-series-title-error">
            <p id="f-series-title-error" class="error" role="alert"></p>
          </div>
          <div class="pair">
            <div class="row">
              <label class="field" for="f-season" data-i18n="field.season"></label>
              <input id="f-season" type="text" inputmode="numeric" maxlength="4" data-field="season" aria-describedby="f-season-error">
              <p id="f-season-error" class="error" role="alert"></p>
            </div>
            <div class="row">
              <label class="field" for="f-episode" data-i18n="field.episode"></label>
              <input id="f-episode" type="text" inputmode="numeric" maxlength="4" data-field="episode" aria-describedby="f-episode-error">
              <p id="f-episode-error" class="error" role="alert"></p>
            </div>
          </div>
          <label class="checkbox" for="pack">
            <input id="pack" type="checkbox">
            <span data-i18n="field.pack"></span>
          </label>
        </div>

        <div class="type-fields" data-type="audiobooks" hidden>
          <div class="row">
            <label class="field" for="f-author" data-i18n="field.author"></label>
            <input id="f-author" type="text" maxlength="200" data-field="author" aria-describedby="f-author-error">
            <p id="f-author-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-book-title" data-i18n="field.book"></label>
            <input id="f-book-title" type="text" maxlength="200" data-field="title" aria-describedby="f-book-title-error">
            <p id="f-book-title-error" class="error" role="alert"></p>
          </div>
        </div>

        <div class="type-fields" data-type="music" hidden>
          <div class="row">
            <label class="field" for="f-artist" data-i18n="field.artist"></label>
            <input id="f-artist" type="text" maxlength="200" data-field="artist" aria-describedby="f-artist-error">
            <p id="f-artist-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-album" data-i18n="field.album"></label>
            <input id="f-album" type="text" maxlength="200" data-field="album" aria-describedby="f-album-error">
            <p id="f-album-error" class="error" role="alert"></p>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="button" class="ghost" id="reset" data-i18n="btn.reset"></button>
        <button type="submit" class="primary" id="submit" data-i18n="btn.submit"></button>
      </div>
      <p id="result" class="result" role="status" aria-live="polite"></p>
    </form>

    <section class="jobs" aria-labelledby="jobs-title">
      <div class="jobs-head">
        <h2 id="jobs-title" class="jobs-title" data-i18n="jobs.title"></h2>
        <button type="button" id="jobs-filter" class="ghost small" aria-pressed="false" hidden></button>
      </div>
      <p id="jobs-banner" class="banner" role="alert" hidden></p>
      <p id="jobs-error" class="error" role="status"></p>
      <ul id="jobs-list" class="job-list"></ul>
      <p id="jobs-empty" class="note" data-i18n="jobs.empty" hidden></p>
    </section>

    <section class="subs" aria-labelledby="subs-title">
      <h2 id="subs-title" class="jobs-title" data-i18n="subs.title"></h2>
      <form id="subs-form" autocomplete="off" novalidate>
        <div class="row">
          <label class="field" for="subs-channel" data-i18n="subs.channel"></label>
          <input id="subs-channel" type="text" inputmode="url" spellcheck="false" autocapitalize="off"
                 autocorrect="off" data-i18n-placeholder="subs.placeholder" aria-describedby="subs-note subs-error">
          <p id="subs-note" class="note" data-i18n="subs.note"></p>
        </div>
        <div class="row">
          <label class="field" for="subs-target" data-i18n="subs.target"></label>
          <select id="subs-target">
            <option value="video" data-i18n="yt.target_video"></option>
            <option value="podcast" data-i18n="yt.target_podcast"></option>
          </select>
        </div>
        <label class="checkbox" for="subs-audio">
          <input id="subs-audio" type="checkbox" disabled>
          <span data-i18n="yt.audio"></span>
        </label>
        <div class="row">
          <label class="field" for="subs-backfill" data-i18n="subs.backfill"></label>
          <input id="subs-backfill" type="text" inputmode="numeric" maxlength="2" value="0" aria-describedby="subs-backfill-note">
          <p id="subs-backfill-note" class="note" data-i18n="subs.backfill_note"></p>
        </div>
        <p id="subs-error" class="error" role="alert"></p>
        <div class="actions">
          <button type="submit" class="primary" id="subs-add" data-i18n="subs.add"></button>
        </div>
        <p id="subs-result" class="result" role="status" aria-live="polite"></p>
      </form>
      <p id="subs-load-error" class="error" role="status"></p>
      <ul id="subs-list" class="job-list"></ul>
      <p id="subs-empty" class="note" data-i18n="subs.empty" hidden></p>
    </section>

    <details class="help">
      <summary data-i18n="help.title"></summary>
      <p data-i18n="help.body"></p>
    </details>
  </main>
</div>
