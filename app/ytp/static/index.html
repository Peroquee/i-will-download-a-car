<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="ytp-static-version" content="__STATIC_VERSION__">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>youtube-premium</title>
  <link id="favicon" rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-auth="unknown">
<div id="vpn" class="vpn-bar vpn-unknown" role="status" data-auth-only>
  <a id="vpn-link" class="vpn-link" href="/dashboard#vpn">
    <span class="vpn-dot" aria-hidden="true"></span>
    <span class="vpn-main"><strong id="vpn-text" data-i18n="vpn.unknown"></strong><span id="vpn-detail" class="vpn-detail"></span></span>
    <span class="vpn-more" data-i18n="vpn.details"></span>
  </a>
</div>
<div id="update-banner" class="update-banner" role="alert" hidden>
  <span id="update-banner-text" data-i18n="reload.new_version"></span>
  <button type="button" id="update-banner-reload" class="ghost small" data-i18n="reload.button"></button>
</div>
<nav id="alert-strip" class="alert-strip" aria-label="Alerts" data-i18n-label="alert.strip_label" data-admin-only hidden>
  <ul id="alert-strip-list" class="alert-strip-list"></ul>
  <div class="alert-strip-tools">
    <a id="alert-strip-more" class="alert-more" href="/dashboard#alerts"></a>
    <button type="button" id="alert-strip-ack" class="ghost small" data-i18n="alert.ack_all" hidden></button>
  </div>
</nav>
<div class="wrap">
  <main class="card" aria-labelledby="title">
    <p id="js-warning" class="js-warning" role="alert">Die Skripte dieser Seite sind nicht geladen oder veraltet. Bitte die Seite neu laden (Strg+F5). / The scripts of this page did not load or are out of date. Please reload the page (Ctrl+F5).</p>
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="32" cy="38" rx="16" ry="15" fill="#dba876"/>
          <path d="M14 30 C14 15 22 9 32 9 C42 9 50 15 50 30 C50 21 42 19 32 19 C22 19 14 21 14 30 Z" fill="#a4372f"/>
          <path d="M45 19 L58 12 L53 25 Z" fill="#a4372f"/>
          <circle cx="25" cy="16" r="1.4" fill="#f2e6c9"/>
          <circle cx="32" cy="13.5" r="1.4" fill="#f2e6c9"/>
          <circle cx="39" cy="16" r="1.4" fill="#f2e6c9"/>
          <path d="M11 31 L53 35" stroke="#171310" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <ellipse cx="25.5" cy="34.5" rx="5.5" ry="4.5" fill="#171310"/>
          <circle cx="41" cy="35" r="2.3" fill="#171310"/>
          <path d="M35.5 31.5 Q41 29.5 45 32" stroke="#171310" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M22 45 C26 41 29.5 46.5 32 44.5 C34.5 46.5 38 41 42 45 C39.5 49.5 34.5 47 32 48 C29.5 47 24.5 49.5 22 45 Z" fill="#2a1c10"/>
        </svg>
      </div>
      <div class="titles">
        <h1 id="title" class="title">youtube-premium</h1>
        <p class="subtitle" data-view="input" data-i18n="subtitle"></p>
        <p class="subtitle" data-view="dashboard" data-i18n="dash.subtitle" hidden></p>
        <p class="subtitle" data-view="subscriptions" data-i18n="subs.subtitle" hidden></p>
      </div>
      <div class="tools">
        <button type="button" id="account-open" class="ghost small account-chip" aria-haspopup="dialog" data-i18n-label="account.menu" data-auth-only></button>
        <button type="button" id="lang" class="ghost small" aria-label="Language / Sprache">DE</button>
      </div>
    </header>

    <section id="login" class="panel login" aria-labelledby="login-title" data-guest-only>
      <h2 id="login-title" class="jobs-title" data-i18n="login.title"></h2>
      <p id="login-note" class="banner" role="alert"></p>
      <p id="login-setup" class="banner" role="alert" hidden></p>
      <form id="login-form" method="post" action="/reload-needed" autocomplete="on" novalidate>
        <div class="row">
          <label class="field" for="login-user" data-i18n="login.user"></label>
          <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="off"
                 autocorrect="off" spellcheck="false" maxlength="64">
        </div>
        <div class="row">
          <label class="field" for="login-password" data-i18n="login.password"></label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="200">
        </div>
        <p id="login-error" class="error" role="alert"></p>
        <div class="actions">
          <button type="submit" class="primary" id="login-submit" data-i18n="login.submit"></button>
        </div>
        <p class="note" data-i18n="login.help"></p>
      </form>
    </section>

    <nav id="topnav" class="topnav" aria-label="Main" data-i18n-label="nav.label" data-auth-only>
      <a id="nav-input" class="nav-item" href="/" data-i18n="nav.input"></a>
      <a id="nav-dashboard" class="nav-item" href="/dashboard" data-i18n="nav.dashboard"></a>
      <a id="nav-subs" class="nav-item" href="/#subscriptions" data-i18n="nav.subs"></a>
      <a id="nav-accounts" class="nav-item" href="/accounts" data-i18n="nav.accounts" data-admin-only></a>
      <button type="button" id="howto-open" class="nav-item nav-howto" aria-haspopup="dialog" data-i18n="howto.button"></button>
    </nav>

    <form id="form" data-view="input" data-auth-only method="post" action="/reload-needed" autocomplete="off" novalidate>
      <div class="row">
        <label class="field" for="link" data-i18n="link.label"></label>
        <input id="link" name="link" type="text" inputmode="url" spellcheck="false"
               autocapitalize="off" autocorrect="off" data-i18n-placeholder="link.placeholder"
               aria-describedby="link-note link-error">
        <p id="link-note" class="note" data-i18n="link.note"></p>
        <p id="link-error" class="error" role="alert"></p>
        <p id="probe-status" class="note probe-status" role="status" aria-live="polite"></p>
      </div>

      <fieldset class="row mode" aria-labelledby="mode-label">
        <legend id="mode-label" class="field" data-i18n="mode.label"></legend>
        <div class="segmented">
          <input type="radio" name="mode" id="mode-youtube" value="youtube" checked>
          <label for="mode-youtube" data-i18n="mode.youtube"></label>
          <input type="radio" name="mode" id="mode-magnet" value="magnet">
          <label for="mode-magnet" data-i18n="mode.magnet"></label>
          <input type="radio" name="mode" id="mode-podcast" value="podcast">
          <label for="mode-podcast" data-i18n="mode.podcast"></label>
        </div>
      </fieldset>

      <section id="youtube-fields" class="panel" aria-live="polite">
        <div class="row">
          <label class="field" for="yt-target" data-i18n="yt.target"></label>
          <select id="yt-target" name="target">
            <option value="video" data-i18n="yt.target_video"></option>
            <option value="podcast" data-i18n="yt.target_podcast"></option>
            <option value="music" data-i18n="yt.target_music"></option>
          </select>
        </div>
        <div id="yt-audio-row" hidden>
          <label class="checkbox" for="yt-audio">
            <input id="yt-audio" type="checkbox">
            <span data-i18n="yt.audio"></span>
          </label>
          <p class="note" data-i18n="yt.audio_note"></p>
        </div>
        <div class="row">
          <label class="field" id="yt-channel-label" for="f-channel" data-i18n="yt.channel"></label>
          <input id="f-channel" name="channel" type="text" maxlength="200" aria-describedby="f-channel-error">
          <p id="f-channel-error" class="error" role="alert"></p>
        </div>
        <div class="row">
          <label class="field" id="yt-title-label" for="f-yt-title" data-i18n="yt.title"></label>
          <input id="f-yt-title" name="title" type="text" maxlength="200" aria-describedby="f-yt-title-error">
          <p id="f-yt-title-error" class="error" role="alert"></p>
        </div>
        <div id="yt-album-row" class="row" hidden>
          <label class="field" for="f-yt-album" data-i18n="yt.album"></label>
          <input id="f-yt-album" name="album" type="text" maxlength="200" aria-describedby="f-yt-album-error">
          <p class="note" data-i18n="yt.album_note"></p>
          <p id="f-yt-album-error" class="error" role="alert"></p>
        </div>
        <p id="probe-duration" class="note"></p>
        <div id="yt-subscribe-row">
          <label class="checkbox" for="subscribe">
            <input id="subscribe" type="checkbox">
            <span data-i18n="yt.subscribe"></span>
          </label>
          <p id="yt-subscribe-note" class="note" data-i18n="yt.subscribe_note"></p>
          <div id="yt-backfill-row" class="row sub-option" hidden>
            <label class="field" for="yt-backfill" data-i18n="subs.backfill"></label>
            <input id="yt-backfill" class="narrow" type="text" inputmode="numeric" maxlength="2" value="0" aria-describedby="yt-backfill-note yt-backfill-error">
            <p id="yt-backfill-note" class="note" data-i18n="subs.backfill_note"></p>
            <p id="yt-backfill-error" class="error" role="alert"></p>
          </div>
        </div>
      </section>

      <section id="podcast-fields" class="panel" aria-live="polite" hidden>
        <p id="pc-status" class="note"></p>
        <div class="row">
          <label class="field" for="f-podcast" data-i18n="pc.folder"></label>
          <input id="f-podcast" name="podcast" type="text" maxlength="200" aria-describedby="f-podcast-error">
          <p id="f-podcast-error" class="error" role="alert"></p>
        </div>
        <div class="row">
          <label class="field" for="pc-episode" data-i18n="pc.episode"></label>
          <select id="pc-episode" name="episode" aria-describedby="pc-episode-error">
            <option value="" data-i18n="pc.none"></option>
          </select>
          <p id="pc-episode-error" class="error" role="alert"></p>
        </div>
        <label class="checkbox" for="pc-subscribe">
          <input id="pc-subscribe" type="checkbox">
          <span data-i18n="pc.subscribe"></span>
        </label>
        <p class="note" data-i18n="pc.subscribe_note"></p>
        <div class="row">
          <label class="field" for="pc-backfill" data-i18n="pc.backfill"></label>
          <input id="pc-backfill" type="text" inputmode="numeric" maxlength="2" value="0" aria-describedby="pc-backfill-error">
          <p id="pc-backfill-error" class="error" role="alert"></p>
        </div>
        <label class="checkbox" for="pc-all">
          <input id="pc-all" type="checkbox">
          <span data-i18n="pc.all"></span>
        </label>
        <p id="pc-all-note" class="note"></p>
        <p id="pc-all-confirm" class="banner" role="alert" hidden></p>
      </section>

      <section id="magnet-fields" class="panel" hidden>
        <div class="row">
          <label class="field" for="media-type" data-i18n="mg.type"></label>
          <select id="media-type" name="media-type">
            <option value="movies" data-i18n="type.movies"></option>
            <option value="series" data-i18n="type.series"></option>
            <option value="audiobooks" data-i18n="type.audiobooks"></option>
            <option value="music" data-i18n="type.music"></option>
          </select>
        </div>

        <div class="type-fields" data-type="movies">
          <div class="row">
            <label class="field" for="f-movie-title" data-i18n="field.title"></label>
            <input id="f-movie-title" type="text" maxlength="200" data-field="title" aria-describedby="f-movie-title-error">
            <p id="f-movie-title-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-year" data-i18n="field.year"></label>
            <input id="f-year" type="text" inputmode="numeric" maxlength="4" data-field="year" aria-describedby="f-year-error">
            <p id="f-year-error" class="error" role="alert"></p>
          </div>
        </div>

        <div class="type-fields" data-type="series" hidden>
          <div class="row">
            <label class="field" for="f-series-title" data-i18n="field.show"></label>
            <input id="f-series-title" type="text" maxlength="200" data-field="title" aria-describedby="f-series-title-error">
            <p id="f-series-title-error" class="error" role="alert"></p>
          </div>
          <div class="pair">
            <div class="row">
              <label class="field" for="f-season" data-i18n="field.season"></label>
              <input id="f-season" type="text" inputmode="numeric" maxlength="4" data-field="season" aria-describedby="f-season-error">
              <p id="f-season-error" class="error" role="alert"></p>
            </div>
            <div class="row">
              <label class="field" for="f-episode" data-i18n="field.episode"></label>
              <input id="f-episode" type="text" inputmode="numeric" maxlength="4" data-field="episode" aria-describedby="f-episode-error">
              <p id="f-episode-error" class="error" role="alert"></p>
            </div>
          </div>
          <label class="checkbox" for="pack">
            <input id="pack" type="checkbox">
            <span data-i18n="field.pack"></span>
          </label>
        </div>

        <div class="type-fields" data-type="audiobooks" hidden>
          <div class="row">
            <label class="field" for="f-author" data-i18n="field.author"></label>
            <input id="f-author" type="text" maxlength="200" data-field="author" aria-describedby="f-author-error">
            <p id="f-author-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-book-title" data-i18n="field.book"></label>
            <input id="f-book-title" type="text" maxlength="200" data-field="title" aria-describedby="f-book-title-error">
            <p id="f-book-title-error" class="error" role="alert"></p>
          </div>
        </div>

        <div class="type-fields" data-type="music" hidden>
          <div class="row">
            <label class="field" for="f-artist" data-i18n="field.artist"></label>
            <input id="f-artist" type="text" maxlength="200" data-field="artist" aria-describedby="f-artist-error">
            <p id="f-artist-error" class="error" role="alert"></p>
          </div>
          <div class="row">
            <label class="field" for="f-album" data-i18n="field.album"></label>
            <input id="f-album" type="text" maxlength="200" data-field="album" aria-describedby="f-album-error">
            <p id="f-album-error" class="error" role="alert"></p>
          </div>
        </div>
      </section>

      <div class="actions">
        <button type="button" class="ghost" id="reset" data-i18n="btn.reset"></button>
        <button type="submit" class="primary" id="submit" data-i18n="btn.submit"></button>
      </div>
      <p id="result" class="result" role="status" aria-live="polite"></p>
    </form>

    <a id="jobs-mini" class="jobs-mini" href="/dashboard" data-view="input" data-auth-only>
      <span class="jobs-mini-label" data-i18n="mini.label"></span>
      <span id="jobs-mini-text" class="jobs-mini-text" role="status" aria-live="polite"></span>
      <progress id="jobs-mini-bar" class="jobs-mini-bar" max="100" hidden></progress>
      <span class="jobs-mini-more" data-i18n="mini.open"></span>
    </a>

    <section id="subscriptions" class="subs" data-view="subscriptions" data-auth-only aria-labelledby="subs-title" hidden>
      <h2 id="subs-title" class="jobs-title" data-i18n="subs.title"></h2>
      <p class="note" data-i18n="subs.how_to_add"></p>
      <p id="subs-result" class="result" role="status" aria-live="polite"></p>
      <p id="subs-load-error" class="error" role="status"></p>
      <ul id="subs-list" class="job-list"></ul>
      <p id="subs-empty" class="note" data-i18n="subs.empty" hidden></p>
    </section>

    <section id="dashboard" class="dashboard" data-view="dashboard" data-auth-only hidden>
      <p id="dash-error" class="error" role="status"></p>

      <section class="jobs" aria-labelledby="dash-active-title">
        <h2 id="dash-active-title" class="jobs-title" data-i18n="dash.active"></h2>
        <ul id="dash-active-list" class="job-list"></ul>
        <p id="dash-active-empty" class="note" data-i18n="dash.active_empty" hidden></p>
      </section>

      <section id="dash-backlog-box" class="jobs" aria-labelledby="dash-backlog-title" hidden>
        <h2 id="dash-backlog-title" class="jobs-title" data-i18n="dash.backlog"></h2>
        <ul id="dash-backlog-list" class="job-list"></ul>
      </section>

      <section class="jobs" aria-labelledby="dash-recent-title">
        <h2 id="dash-recent-title" class="jobs-title" data-i18n="dash.recent"></h2>
        <ul id="dash-recent-list" class="job-list"></ul>
        <p id="dash-recent-empty" class="note" data-i18n="dash.recent_empty" hidden></p>
      </section>

      <section id="dash-vpn" class="jobs" aria-labelledby="dash-vpn-title">
        <h2 id="dash-vpn-title" class="jobs-title" data-i18n="dash.vpn"></h2>
        <p id="dash-vpn-now" class="dash-vpn-now"></p>
        <p id="dash-vpn-explain" class="note"></p>
        <p id="dash-disk" class="note" data-admin-only></p>
        <p id="dash-deploy" class="note" data-admin-only hidden></p>
        <ul id="dash-vpn-list" class="dash-events" data-admin-only></ul>
        <p id="dash-vpn-empty" class="note" data-i18n="dash.vpn_empty" data-admin-only hidden></p>
      </section>

      <section id="alerts" class="jobs" data-admin-only aria-labelledby="dash-alerts-title">
        <div class="jobs-head">
          <h2 id="dash-alerts-title" class="jobs-title" data-i18n="dash.alerts"></h2>
          <button type="button" id="dash-alerts-ack" class="ghost small" data-i18n="alert.ack_all" hidden></button>
        </div>
        <p id="dash-alerts-error" class="error" role="status"></p>
        <ul id="dash-alerts-list" class="job-list"></ul>
        <p id="dash-alerts-empty" class="note" data-i18n="alert.empty" hidden></p>
      </section>
    </section>

    <section id="accounts" class="subs" data-view="accounts" data-auth-only data-admin-only aria-labelledby="accounts-title" hidden>
      <h2 id="accounts-title" class="jobs-title" data-i18n="accounts.title"></h2>
      <form id="accounts-form" method="post" action="/reload-needed" autocomplete="off" novalidate>
        <div class="row">
          <label class="field" for="accounts-name" data-i18n="accounts.name"></label>
          <input id="accounts-name" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="64" autocomplete="off">
        </div>
        <div class="row">
          <label class="field" for="accounts-password" data-i18n="accounts.password"></label>
          <input id="accounts-password" type="password" autocomplete="new-password" maxlength="200">
        </div>
        <div class="row">
          <label class="field" for="accounts-role" data-i18n="accounts.role"></label>
          <select id="accounts-role">
            <option value="user" data-i18n="role.user"></option>
            <option value="admin" data-i18n="role.admin"></option>
          </select>
        </div>
        <div class="actions">
          <button type="submit" class="primary" id="accounts-add" data-i18n="accounts.add"></button>
        </div>
        <p id="accounts-result" class="result" role="status" aria-live="polite"></p>
      </form>
      <p id="accounts-load-error" class="error" role="status"></p>
      <ul id="accounts-list" class="job-list"></ul>
    </section>

    <details class="help" data-view="input" data-auth-only>
      <summary data-i18n="help.title"></summary>
      <p data-i18n="help.body"></p>
    </details>
  </main>
</div>

<dialog id="account" class="howto account" aria-labelledby="account-title">
  <h2 id="account-title" data-i18n="account.title"></h2>
  <p id="account-who" class="note"></p>
  <h3 data-i18n="account.password_title"></h3>
  <form id="account-form" method="post" action="/reload-needed" autocomplete="off" novalidate>
    <div class="row">
      <label class="field" for="account-current" data-i18n="account.current"></label>
      <input id="account-current" type="password" autocomplete="current-password" maxlength="200">
    </div>
    <div class="row">
      <label class="field" for="account-new" data-i18n="account.new"></label>
      <input id="account-new" type="password" autocomplete="new-password" maxlength="200">
    </div>
    <div class="row">
      <label class="field" for="account-repeat" data-i18n="account.repeat"></label>
      <input id="account-repeat" type="password" autocomplete="new-password" maxlength="200">
    </div>
    <p id="account-result" class="result" role="status" aria-live="polite"></p>
    <div class="actions">
      <button type="submit" class="primary" id="account-change" data-i18n="account.change"></button>
      <button type="button" class="ghost" id="account-logout" data-i18n="account.logout"></button>
      <button type="button" class="ghost" id="account-close" data-i18n="account.close"></button>
    </div>
  </form>
</dialog>

<dialog id="howto" class="howto" aria-labelledby="howto-title">
  <div class="howto-head">
    <h2 id="howto-title" class="jobs-title" data-i18n="howto.title"></h2>
    <button type="button" id="howto-close" class="ghost small" data-i18n="howto.close"></button>
  </div>
  <p class="note" data-i18n="howto.intro"></p>
  <ol class="howto-steps">
    <li><h3 data-i18n="howto.s1.title"></h3><svg class="ill" viewBox="0 0 240 130" role="img" data-i18n-label="howto.s1.alt" xmlns="http://www.w3.org/2000/svg">
<rect class="ill-win" x="10" y="8" width="220" height="114" rx="8"/>
<rect class="ill-bar" x="10" y="8" width="220" height="18" rx="8"/>
<rect class="ill-line" x="22" y="40" width="110" height="9" rx="3"/>
<rect class="ill-line" x="22" y="56" width="150" height="6" rx="3"/>
<rect class="ill-line" x="22" y="68" width="130" height="6" rx="3"/>
<rect class="ill-btn" x="22" y="88" width="62" height="22" rx="5"/>
<rect class="ill-hi" x="96" y="84" width="76" height="30" rx="6"/>
<path class="ill-magnet" d="M118 92 v8 a8 8 0 0 0 16 0 v-8 h-5 v8 a3 3 0 0 1 -6 0 v-8 z"/>
