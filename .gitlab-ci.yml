# youtube-premium pipeline.
#
# Runner model:
#   untagged jobs   need nothing from the host: lint, unit, and integration
#                   (docker compose CLI only, no daemon). They run on the shared
#                   docker-executor runner.
#   tags: [ytp-host]  need a real Docker daemon on the youtube-premium VM with
#                   /dev/net/tun: smoke, system, regression. They run ONLY on a
#                   dedicated runner on that VM, never on the shared runner (mounting
#                   its docker.sock or running privileged dind there would give any job
#                   root on a host that builds other projects).
#
# The ytp-host runner does not exist yet (the VM is not provisioned). Until it does,
# smoke, system and regression are gated by the CI/CD variable YTP_HOST_RUNNER: they
# are absent from the pipeline unless it is "1", so they neither block an MR nor
# pretend to pass. Register the runner with the tag ytp-host, then set
# YTP_HOST_RUNNER=1 in Settings > CI/CD > Variables (see docs/testing.md).
#
# Executor assumptions for the ytp-host runner:
#   - docker executor: mount the host daemon, i.e. in config.toml
#     [runners.docker] volumes = ["/var/run/docker.sock:/var/run/docker.sock", "/cache"]
#   - shell executor: `image:` is ignored; the VM needs python3, python3-venv,
#     docker and the compose plugin. The before_scripts work unchanged.
#
# Test levels map 1:1 to tests/<level>/ and to the stages below. See docs/testing.md.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open MR runs as an MR pipeline only, never twice.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE =~ /^(schedule|web|api)$/
  auto_cancel:
    on_new_commit: interruptible

stages:
  - lint
  - unit
  - integration
  - smoke
  - system
  - regression

variables:
  PYTHON_IMAGE: python:3.12-slim-bookworm
  DOCKER_CLI_IMAGE: docker:29-cli
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.28.0
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTEST_COMMON: -ra --timeout=600 --junitxml=reports/junit-$CI_JOB_NAME_SLUG.xml
  # Set TEST_IMAGE_BUSYBOX / TEST_IMAGE_PYTHON as CI/CD variables to use a mirror.

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure, scheduler_failure]

# ---------------------------------------------------------------- templates

.pip-cache:
  cache:
    key:
      files: [requirements-test.txt, requirements-lint.txt]
    paths: [.cache/pip]

.python:
  extends: .pip-cache
  image: $PYTHON_IMAGE

.venv-lint: &venv-lint
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install -q -r requirements-lint.txt

.venv-test: &venv-test
  - python3 -m venv .venv
  - . .venv/bin/activate
  - pip install -q -r requirements-test.txt

# Alpine-based docker CLI image: add bash and python. No-op on a shell executor.
.ensure-python: &ensure-python
  - if command -v apk >/dev/null 2>&1; then apk add --no-cache bash python3 py3-pip >/dev/null; fi

.reports:
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [reports/]
    reports:
      junit: reports/junit-*.xml

# Needs only the docker compose CLI, no daemon. Runs on any runner.
.compose-cli:
  extends: [.pip-cache, .reports]
  image: $DOCKER_CLI_IMAGE
  before_script:
    - *ensure-python
    - *venv-test
    - docker compose version

# Needs the Docker daemon of the youtube-premium VM with /dev/net/tun. Runs only on
# the dedicated ytp-host runner, and only once YTP_HOST_RUNNER=1 is set (see header).
.docker-host:
  extends: [.pip-cache, .reports]
  image: $DOCKER_CLI_IMAGE
  tags: [ytp-host]
  rules:
    - if: $YTP_HOST_RUNNER == "1"
  variables:
    # A missing daemon or tun device fails the job instead of skipping tests.
    REQUIRE_CAPABILITIES: "1"
  before_script:
    - *ensure-python
    - *venv-test
    - docker info --format 'Docker Engine {{.ServerVersion}} on {{.OperatingSystem}}'
    - docker compose version
  after_script:
    # Remove anything a crashed test left behind (all test resources use this prefix).
    - docker ps -aq --filter "name=ytp-test-" | xargs -r docker rm -f || true
    - docker volume ls -q --filter "name=ytp-test-" | xargs -r docker volume rm -f || true

# ---------------------------------------------------------------- lint

lint:python:
  stage: lint
  extends: .python
  needs: []
  before_script: *venv-lint
  script:
    - ruff check --exit-zero --output-format=gitlab --output-file=gl-code-quality.json .
    - ruff check .
    - ruff format --check --diff .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality.json

lint:yaml:
  stage: lint
  extends: .python
  needs: []
  before_script: *venv-lint
  script:
    - yamllint --strict .

lint:shell:
  stage: lint
  extends: .python
  needs: []
  before_script: *venv-lint
  script:
    - find scripts -name '*.sh' -print0 | xargs -0 shellcheck --external-sources --severity=style

lint:secrets:
  stage: lint
  needs: []
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0   # scan the full history, not just the last commit
  script:
    - mkdir -p reports
    - gitleaks git --redact --verbose --report-format junit --report-path reports/junit-gitleaks.xml .
  artifacts:
    when: always
    reports:
      junit: reports/junit-gitleaks.xml

# ---------------------------------------------------------------- tests

test:unit:
  stage: unit
  extends: [.python, .reports]
  needs: []
  # The app's tests need FastAPI and its test client (requirements-app.txt).
  before_script:
    - *venv-test
    - pip install -q -r requirements-app.txt
  script:
    - pytest tests/unit $PYTEST_COMMON
    # Add --cov=app and a coverage report here once app/ exists (#8).

test:integration:
  stage: integration
  extends: .compose-cli
  needs: [test:unit]
  script:
    - pytest tests/integration $PYTEST_COMMON

test:smoke:
  stage: smoke
  extends: .docker-host
  needs: [test:unit]
  script:
    - pytest tests/smoke $PYTEST_COMMON

test:system:
  stage: system
  extends: .docker-host
  needs: [test:smoke, test:integration]
  timeout: 30m
  script:
    - pytest tests/system $PYTEST_COMMON

test:regression:
  stage: regression
  extends: .docker-host
  needs: [test:unit]
  script:
    - pytest tests/regression $PYTEST_COMMON
