# youtube-premium stack: skeleton (issue #1, C0).
#
# Proxmox -> Debian 12 VM -> Docker Compose. Docker runs in a full VM, never in
# an unprivileged LXC, because the killswitch depends on qbittorrent sharing
# gluetun's network namespace (network_mode: service:gluetun) and on gluetun
# getting NET_ADMIN plus /dev/net/tun.
#
# Every value comes from .env (template: .env.example). Required values use
# ${VAR:?message}, so a missing secret stops `docker compose` instead of
# starting a half-configured VPN.
#
# Services marked `profiles: [planned]` are placeholders for later issues and
# do not start with a plain `docker compose up -d`.

name: youtube-premium

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-media-env: &media-env
  TZ: ${TZ:?TZ must be set in .env}
  PUID: ${PUID:?PUID must be set in .env}
  PGID: ${PGID:?PGID must be set in .env}
  UMASK: ${UMASK:?UMASK must be set in .env}

services:
  # VPN tunnel and firewall killswitch (#2). The VPN type is chosen with VPN_TYPE
  # (default openvpn, which is what ExpressVPN supports). The credentials of the
  # chosen type live in compose/vpn-<type>.yml and are required there, so a missing
  # secret for the ACTIVE type stops compose while the other type's variables are
  # never read. ExpressVPN has no port forwarding: do not add VPN_PORT_FORWARDING.
  gluetun:
    <<: *service-defaults
    extends:
      file: compose/vpn-${VPN_TYPE:-openvpn}.yml
      service: gluetun
    image: qmcgaw/gluetun:${GLUETUN_TAG:?GLUETUN_TAG must be set in .env}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:?TZ must be set in .env}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?VPN_SERVICE_PROVIDER must be set in .env}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      SERVER_CITIES: ${VPN_SERVER_CITIES:-}
      # The LAN stays reachable outside the tunnel so the Web UI answers; every
      # other destination is blocked unless it goes through the VPN.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:?LAN_SUBNET must be set in .env}
    # Gluetun's own health check: healthy only while the tunnel works, so that
    # qbittorrent's depends_on (service_healthy) is meaningful. The long start
    # period gives OpenVPN time to connect before failures count.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      # Gluetun's state (servers.json and so on) survives container recreation, and the
      # rendered ExpressVPN config sits in ./config/gluetun/custom/ (scripts/vpn/render_ovpn.py).
      - ./config/gluetun:/gluetun
    ports:
      # qBittorrent's Web UI lives in gluetun's network namespace, so its
      # port is published here and ONLY here. Bound to localhost until the
      # reverse proxy (#9) exists; never 0.0.0.0 without a login in front.
      - "${QBIT_WEBUI_BIND:?QBIT_WEBUI_BIND must be set in .env}:${QBIT_WEBUI_PORT:?QBIT_WEBUI_PORT must be set in .env}:8080"

  # Torrent client with no network of its own (#3): it shares gluetun's network
  # namespace, so it has no route except through the tunnel and publishes no ports
  # itself. Web UI user and password are seeded by scripts/qbittorrent/seed_config.py
  # (never in Git); see docs/host-setup.md.
  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:?QBITTORRENT_TAG must be set in .env}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *media-env
      WEBUI_PORT: "8080"
    # Unhealthy while the container's network namespace is dead (gluetun was restarted
    # as the same container). The watcher below then stops the container so that
    # `restart: unless-stopped` re-attaches it to gluetun's new namespace.
    healthcheck:
      test: ["CMD", "/custom-services.d/netwatch", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./config/qbittorrent:/config
      # s6 services of the linuxserver image (see scripts/qbittorrent/services/netwatch). The
      # whole folder is mounted, not one file: a bind-mounted single file keeps its old inode
      # after `git pull` replaces it. The image copies the folder into s6 at container start,
      # so after a pull that changes the script run `docker restart qbittorrent`.
      - ./scripts/qbittorrent/services:/custom-services.d:ro
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}:/data

  # The app (#8): FastAPI. It is on the default bridge network and publishes NO port, so
  # nothing outside this host can reach it until the reverse proxy with login exists (#29);
  # the proxy will reach it as http://app:8000 over the bridge. It runs as PUID:PGID.
  # Docker builds the image from app/ (no daemon is available in CI: see docs/testing.md).
  app:
    <<: *service-defaults
    build: ./app
    image: youtube-premium/app:dev
    user: "${PUID:?PUID must be set in .env}:${PGID:?PGID must be set in .env}"
    environment:
      <<: *media-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Library folder per media type, relative to /data (same names as in .env.example).
      MEDIA_DIR_MOVIES: ${MEDIA_DIR_MOVIES:?MEDIA_DIR_MOVIES must be set in .env}
      MEDIA_DIR_SERIES: ${MEDIA_DIR_SERIES:?MEDIA_DIR_SERIES must be set in .env}
      MEDIA_DIR_AUDIOBOOKS: ${MEDIA_DIR_AUDIOBOOKS:?MEDIA_DIR_AUDIOBOOKS must be set in .env}
      MEDIA_DIR_MUSIC: ${MEDIA_DIR_MUSIC:?MEDIA_DIR_MUSIC must be set in .env}
      MEDIA_DIR_YOUTUBE: ${MEDIA_DIR_YOUTUBE:?MEDIA_DIR_YOUTUBE must be set in .env}
      # Jellyfin runs outside this stack (own LXC); the app only calls its API to refresh
      # libraries. Optional in compose: the key is a secret the owner creates in Jellyfin
      # (docs/jellyfin.md). The app starts without them and says so in its log.
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
    volumes:
      - ./config/app:/config
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}:/data

  # Second safety layer: pauses all torrents when the VPN drops. Placeholder until #18.
  watchdog:
    <<: *service-defaults
    profiles: [planned]
    image: youtube-premium/watchdog:dev
    environment:
      TZ: ${TZ:?TZ must be set in .env}

  # Reverse proxy with login, LAN only. Placeholder until #9.
  proxy:
    <<: *service-defaults
    profiles: [planned]
    image: caddy:${CADDY_TAG:?CADDY_TAG must be set in .env}
    volumes:
      - ./config/caddy:/data
