# youtube-premium stack: skeleton (issue #1, C0).
#
# Proxmox -> Debian 12 VM -> Docker Compose. Docker runs in a full VM, never in
# an unprivileged LXC, because the killswitch depends on qbittorrent sharing
# gluetun's network namespace (network_mode: service:gluetun) and on gluetun
# getting NET_ADMIN plus /dev/net/tun.
#
# Every value comes from .env (template: .env.example). Required values use
# ${VAR:?message}, so a missing secret stops `docker compose` instead of
# starting a half-configured VPN.
#
# Services marked `profiles: [planned]` are placeholders for later issues and
# do not start with a plain `docker compose up -d` (none are left at the moment).

name: youtube-premium

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-media-env: &media-env
  TZ: ${TZ:?TZ must be set in .env}
  PUID: ${PUID:?PUID must be set in .env}
  PGID: ${PGID:?PGID must be set in .env}
  UMASK: ${UMASK:?UMASK must be set in .env}

services:
  # VPN tunnel and firewall killswitch (#2). The VPN type is chosen with VPN_TYPE
  # (default openvpn, which is what ExpressVPN supports). The credentials of the
  # chosen type live in compose/vpn-<type>.yml and are required there, so a missing
  # secret for the ACTIVE type stops compose while the other type's variables are
  # never read. ExpressVPN has no port forwarding: do not add VPN_PORT_FORWARDING.
  gluetun:
    <<: *service-defaults
    extends:
      file: compose/vpn-${VPN_TYPE:-openvpn}.yml
      service: gluetun
    image: qmcgaw/gluetun:${GLUETUN_TAG:?GLUETUN_TAG must be set in .env}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:?TZ must be set in .env}
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER:?VPN_SERVICE_PROVIDER must be set in .env}
      SERVER_COUNTRIES: ${VPN_SERVER_COUNTRIES:-}
      SERVER_CITIES: ${VPN_SERVER_CITIES:-}
      # The LAN stays reachable outside the tunnel so the Web UI answers; every
      # other destination is blocked unless it goes through the VPN.
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET:?LAN_SUBNET must be set in .env}
      # gluetun's HTTP proxy (inside the bridge network only, never published) lets the app's
      # yt-dlp ask YouTube THROUGH the VPN (#17, docs/youtube.md). No URL logging.
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
    # Gluetun's own health check: healthy only while the tunnel works, so that
    # qbittorrent's depends_on (service_healthy) is meaningful. The long start
    # period gives OpenVPN time to connect before failures count.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      # Gluetun's state (servers.json and so on) survives container recreation, and the
      # rendered ExpressVPN config sits in ./config/gluetun/custom/ (scripts/vpn/render_ovpn.py).
      - ./config/gluetun:/gluetun
    ports:
      # qBittorrent's Web UI lives in gluetun's network namespace, so its
      # port is published here and ONLY here. Bound to localhost: the LAN reaches the
      # Web UI through the proxy (#29), which adds the LAN check and a login.
      - "${QBIT_WEBUI_BIND:?QBIT_WEBUI_BIND must be set in .env}:${QBIT_WEBUI_PORT:?QBIT_WEBUI_PORT must be set in .env}:8080"

  # Torrent client with no network of its own (#3): it shares gluetun's network
  # namespace, so it has no route except through the tunnel and publishes no ports
  # itself. Web UI user and password are seeded by scripts/qbittorrent/seed_config.py
  # (never in Git); see docs/host-setup.md.
  qbittorrent:
    <<: *service-defaults
    image: lscr.io/linuxserver/qbittorrent:${QBITTORRENT_TAG:?QBITTORRENT_TAG must be set in .env}
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    environment:
      <<: *media-env
      WEBUI_PORT: "8080"
    # Unhealthy while the container's network namespace is dead (gluetun was restarted
    # as the same container). The watcher below then stops the container so that
    # `restart: unless-stopped` re-attaches it to gluetun's new namespace.
    healthcheck:
      test: ["CMD", "/custom-services.d/netwatch", "--check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./config/qbittorrent:/config
      # s6 services of the linuxserver image (see scripts/qbittorrent/services/netwatch). The
      # whole folder is mounted, not one file: a bind-mounted single file keeps its old inode
      # after `git pull` replaces it. The image copies the folder into s6 at container start,
      # so after a pull that changes the script run `docker restart qbittorrent`.
      - ./scripts/qbittorrent/services:/custom-services.d:ro
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}:/data

  # The app (#8): FastAPI. It is on the default bridge network and publishes NO port, so
  # nothing outside this host can reach it except through the reverse proxy with login (#29),
  # which reaches it as http://app:8000 over the bridge. It runs as PUID:PGID.
  # Docker builds the image from app/ (no daemon is available in CI: see docs/testing.md).
  app:
    <<: *service-defaults
    build: ./app
    image: youtube-premium/app:dev
    user: "${PUID:?PUID must be set in .env}:${PGID:?PGID must be set in .env}"
    environment:
      <<: *media-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Library folder per media type, relative to /data (same names as in .env.example).
      MEDIA_DIR_MOVIES: ${MEDIA_DIR_MOVIES:?MEDIA_DIR_MOVIES must be set in .env}
      MEDIA_DIR_SERIES: ${MEDIA_DIR_SERIES:?MEDIA_DIR_SERIES must be set in .env}
      MEDIA_DIR_AUDIOBOOKS: ${MEDIA_DIR_AUDIOBOOKS:?MEDIA_DIR_AUDIOBOOKS must be set in .env}
      MEDIA_DIR_MUSIC: ${MEDIA_DIR_MUSIC:?MEDIA_DIR_MUSIC must be set in .env}
      MEDIA_DIR_PODCASTS: ${MEDIA_DIR_PODCASTS:?MEDIA_DIR_PODCASTS must be set in .env}
      MEDIA_DIR_YOUTUBE: ${MEDIA_DIR_YOUTUBE:?MEDIA_DIR_YOUTUBE must be set in .env}
      # Jellyfin runs outside this stack (own LXC); the app only calls its API to refresh
      # libraries. Optional in compose: the key is a secret the owner creates in Jellyfin
      # (docs/jellyfin.md). The app starts without them and says so in its log.
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      # qBittorrent's Web UI is in gluetun's network namespace: over the bridge it is gluetun:8080
      # (WEBUI_PORT is fixed at 8080 above). The login is the one scripts/qbittorrent/seed_config.py
      # set; the password is a secret you put in .env (optional here: the app starts without it
      # and says downloads are disabled).
      QBIT_URL: http://gluetun:8080
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      # The VPN watchdog's status page, for the UI badge (#22).
      WATCHDOG_STATUS_URL: http://watchdog:8090
      # yt-dlp (YouTube, #17) goes out through gluetun's HTTP proxy, i.e. through the VPN. Set
      # EMPTY in .env to ask YouTube directly from the home line. (No colon: unset = default.)
      YTDLP_PROXY: ${YTDLP_PROXY-http://gluetun:8888}
      # Tallest YouTube video to download in pixels (0 = no limit); a disk-space knob (#18).
      YOUTUBE_MAX_HEIGHT: ${YOUTUBE_MAX_HEIGHT:-1080}
      # How often subscribed channels are checked for new videos, in minutes; 0 = never (#20).
      SUBSCRIPTION_POLL_MINUTES: ${SUBSCRIPTION_POLL_MINUTES:-60}
      # Podcast feeds and episodes (#34) are fetched through the same proxy (the VPN); set EMPTY in
      # .env to fetch directly. (No colon: unset = default.) How often feeds are checked, in minutes.
      PODCAST_PROXY: ${PODCAST_PROXY-http://gluetun:8888}
      PODCAST_POLL_MINUTES: ${PODCAST_POLL_MINUTES:-240}
      # The first admin account (#44); the hash is made by scripts/app/set_admin.py.
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD_HASH: ${APP_ADMIN_PASSWORD_HASH:-}
      # Give up on a magnet link that shows no progress for this many days; 0 = never (#40).
      MAGNET_STALL_DAYS: ${MAGNET_STALL_DAYS:-7}
      # Networks podcast fetches never go to, besides the private ones: the home line's own global
      # addresses (DS-Lite: the LAN has native global IPv6), see docs/podcasts.md. HOME_PUBLIC_IP is
      # the same setting the watchdog's egress check uses (#23).
      HOME_PUBLIC_IP: ${HOME_PUBLIC_IP:-}
      FETCH_BLOCKED_NETWORKS: ${FETCH_BLOCKED_NETWORKS:-}
      # The dashboard's "internet" check connects here (a host the app contacts anyway). No colon:
      # unset = default, set EMPTY = check off.
      INTERNET_CHECK_HOST: ${INTERNET_CHECK_HOST-www.youtube.com}
      INTERNET_CHECK_PORT: ${INTERNET_CHECK_PORT:-443}
    volumes:
      # The app's database folder (#9). The app runs as PUID:PGID and cannot create or chown it,
      # and Docker would create a MISSING source as root:root, which the app can then not write.
      # So the source must exist already, made by `make layout` (scripts/host/create-layout.sh);
      # create_host_path: false turns "forgot it" into an error at `up` instead of a root-owned folder.
      - type: bind
        source: ./config/app
        target: /config
        bind:
          create_host_path: false
      - ${DATA_ROOT:?DATA_ROOT must be set in .env}:/data

  # Second safety layer (#21): pauses all torrents when the VPN drops. Gluetun's firewall is the
  # real protection; this is a separate small process (same image as the app, `python -m
  # ytp.watchdog`) that keeps working if the app is wedged. It asks gluetun's control server for
  # the VPN status every second with a read-only key (scripts/watchdog/setup_key.py), and after
  # WATCHDOG_THRESHOLD failures in a row tells qBittorrent to pause everything. No ports, no
  # volumes, no database, no capabilities. See docs/watchdog.md.
  watchdog:
    <<: *service-defaults
    build: ./app
    image: youtube-premium/app:dev
    command: ["python", "-m", "ytp.watchdog"]
    user: "${PUID:?PUID must be set in .env}:${PGID:?PGID must be set in .env}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:?TZ must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GLUETUN_CONTROL_URL: http://gluetun:8000
      GLUETUN_CONTROL_APIKEY: ${GLUETUN_CONTROL_APIKEY:?GLUETUN_CONTROL_APIKEY must be set (make watchdog-key)}
      QBIT_URL: http://gluetun:8080
      QBIT_USER: ${QBIT_USER:-admin}
      # Empty = the watchdog refuses to start (exit 2, says so in its log): without the password it could not pause anything.
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      WATCHDOG_INTERVAL: ${WATCHDOG_INTERVAL:-1}
      WATCHDOG_THRESHOLD: ${WATCHDOG_THRESHOLD:-3}
      WATCHDOG_RESUME_AFTER: ${WATCHDOG_RESUME_AFTER:-0}
      # Alerts (#22): off while ALERT_URL is empty. The URL and token are secrets.
      ALERT_URL: ${ALERT_URL:-}
      ALERT_TOKEN: ${ALERT_TOKEN:-}
      ALERT_FORMAT: ${ALERT_FORMAT:-ntfy}
      # A tiny read-only status page for the app's badge, inside the bridge network only (no
      # published port): http://watchdog:8090/status
      WATCHDOG_STATUS_PORT: "8090"
      # The slow egress sanity check (#23), every EGRESS_CHECK_INTERVAL seconds (0 = off).
      EGRESS_CHECK_INTERVAL: ${EGRESS_CHECK_INTERVAL:-300}
      EGRESS_CONFIRM: ${EGRESS_CONFIRM:-2}
      HOME_PUBLIC_IP: ${HOME_PUBLIC_IP:-}
      EGRESS_EXPECTED_COUNTRY: ${EGRESS_EXPECTED_COUNTRY:-}
    # Unhealthy when the poll loop stopped, or when it cannot read the VPN status (the key or
    # gluetun's auth file is wrong): then it protects nothing, and docker compose ps says so.
    healthcheck:
      test: ["CMD", "python", "-m", "ytp.watchdog", "--check"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Reverse proxy with login, LAN only (#29): the ONLY way in from the LAN. Caddy checks that the
  # client is inside LAN_SUBNET and asks for a login (proxy/Caddyfile, docs/proxy.md), then passes
  # on to the app (:8080 inside, PROXY_PORT outside) or to qBittorrent's Web UI (:8081, PROXY_QBT_PORT).
  # It starts only with a user and a password hash in .env (scripts/proxy/set_password.py). Runs
  # as PUID:PGID with a read-only root and no capabilities except the one its binary needs to
  # start (NET_BIND_SERVICE is a file capability of the official image; it listens on ports > 1024).
  proxy:
    <<: *service-defaults
    image: caddy:${CADDY_TAG:?CADDY_TAG must be set in .env}
    user: "${PUID:?PUID must be set in .env}:${PGID:?PGID must be set in .env}"
    depends_on:
      app:
        condition: service_healthy
    environment:
      LAN_SUBNET: ${LAN_SUBNET:?LAN_SUBNET must be set in .env}
      PROXY_USER: ${PROXY_USER:?PROXY_USER must be set in .env (make proxy-password)}
      # A bcrypt hash, single-quoted in .env because it contains "$" (make proxy-password does that).
      PROXY_PASSWORD_HASH: ${PROXY_PASSWORD_HASH:?PROXY_PASSWORD_HASH must be set in .env (make proxy-password)}
    ports:
      # HOST_IP:HOST_PORT:CONTAINER_PORT. Bind the VM's LAN address, never a public one.
      - "${PROXY_BIND:?PROXY_BIND must be set in .env}:${PROXY_PORT:?PROXY_PORT must be set in .env}:8080"
      - "${PROXY_BIND}:${PROXY_QBT_PORT:?PROXY_QBT_PORT must be set in .env}:8081"
    volumes:
      # The whole folder, read-only (a single bind-mounted file keeps its old inode after git pull).
      - ./proxy:/etc/caddy:ro
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
