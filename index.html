<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Link Subscriber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1420;
      --panel: #101a24;
      --ink: #e9e4d8;
      --muted: #8b95a3;
      --gold: #c9a227;
      --gold-soft: rgba(201, 162, 39, 0.16);
      --line: rgba(233, 228, 216, 0.07);
      --radius: 14px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html, body {
      height: 100%;
      margin: 0;
      background:
        radial-gradient(700px 420px at 50% 0%, rgba(201, 162, 39, 0.05), transparent 60%),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: linear-gradient(180deg, rgba(233, 228, 216, 0.025), rgba(233, 228, 216, 0)), var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      box-sizing: border-box;
      border: 1px solid var(--line);
    }
    .header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo {
      flex: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #182531, #0c141c 75%);
      border: 1px solid rgba(201, 162, 39, 0.35);
      box-shadow: inset 0 0 0 3px rgba(201, 162, 39, 0.07), 0 6px 14px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 34px; height: 34px; display: block; }
    .title {
      font-family: "IM Fell English", Georgia, serif;
      font-size: 23px;
      letter-spacing: 0.2px;
      color: var(--ink);
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    form { display: grid; gap: 14px; }
    label.field {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(233, 228, 216, 0.03);
      color: inherit;
      outline: none;
      font-size: 14px;
      box-sizing: border-box;
      transition: box-shadow .15s, border-color .15s;
    }
    input[type="text"]:focus, input[type="url"]:focus {
      box-shadow: 0 0 0 3px var(--gold-soft);
      border-color: rgba(201, 162, 39, 0.45);
    }
    .controls {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
    }
    .checkbox {
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .checkbox input { width: 17px; height: 17px; accent-color: var(--gold); }
    .muted { color: var(--muted); font-size: 13px; }
    .sub-options {
      margin-left: 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .date-input {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      color: inherit;
      width: 140px;
      font-size: 13px;
    }
    .date-input:focus {
      outline: none;
      box-shadow: 0 0 0 3px var(--gold-soft);
      border-color: rgba(201, 162, 39, 0.45);
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }
    button.primary {
      background: var(--gold);
      color: #1a1305;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    button.primary:hover { background: #ddb437; }
    button.ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    button.ghost:hover { border-color: rgba(233, 228, 216, 0.2); color: var(--ink); }
    .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
    @media (max-width: 520px) {
      .header { gap: 12px; }
      .logo { width: 48px; height: 48px; }
      .logo svg { width: 28px; height: 28px; }
      .card { padding: 18px; }
      .date-input { width: 120px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="region" aria-label="Link subscriber">
      <div class="header">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="32" cy="38" rx="16" ry="15" fill="#dba876"/>
            <path d="M14 30 C14 15 22 9 32 9 C42 9 50 15 50 30 C50 21 42 19 32 19 C22 19 14 21 14 30 Z" fill="#a4372f"/>
            <path d="M45 19 L58 12 L53 25 Z" fill="#a4372f"/>
            <circle cx="25" cy="16" r="1.4" fill="#f2e6c9"/>
            <circle cx="32" cy="13.5" r="1.4" fill="#f2e6c9"/>
            <circle cx="39" cy="16" r="1.4" fill="#f2e6c9"/>
            <path d="M11 31 L53 35" stroke="#171310" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <ellipse cx="25.5" cy="34.5" rx="5.5" ry="4.5" fill="#171310"/>
            <circle cx="41" cy="35" r="2.3" fill="#171310"/>
            <path d="M35.5 31.5 Q41 29.5 45 32" stroke="#171310" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <path d="M22 45 C26 41 29.5 46.5 32 44.5 C34.5 46.5 38 41 42 45 C39.5 49.5 34.5 47 32 48 C29.5 47 24.5 49.5 22 45 Z" fill="#2a1c10"/>
          </svg>
        </div>
        <div>
          <div class="title">Link Subscriber</div>
          <div class="subtitle">Paste a YouTube link and choose subscription options</div>
        </div>
      </div>

      <form id="mainForm" autocomplete="off" novalidate>
        <div>
          <label class="field" for="linkInput"><strong>Link</strong></label>
          <div class="input">
            <input id="linkInput" name="link" type="url" placeholder="https://www.youtube.com/@channel or a video URL" required />
          </div>
          <div class="note" id="linkNote">Enter a valid YouTube URL</div>
        </div>

        <div>
          <label class="field"><strong>Options</strong></label>
          <div class="controls">
            <label class="checkbox">
              <input id="subscribe" type="checkbox" />
              <span><strong>Subscribe</strong></span>
            </label>

            <div id="subOptions" class="sub-options" style="display:none;">
              <label class="checkbox">
                <input id="entireBackcatalog" type="checkbox" />
                <span class="muted">Entire backcatalog</span>
              </label>

              <label class="checkbox">
                <input id="backcatalogSince" type="checkbox" />
                <span class="muted">Backcatalog since</span>
              </label>

              <input id="sinceDate" class="date-input" type="text" inputmode="numeric"
                     placeholder="dd.mm.yy" aria-label="Backcatalog since date" style="display:none;" />
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="ghost" id="resetBtn">Reset</button>
          <button type="submit" class="primary" id="submitBtn">Save</button>
        </div>

        <div id="result" class="note" style="display:none;"></div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const els = {
        subscribe: document.getElementById('subscribe'),
        subOptions: document.getElementById('subOptions'),
        entireBackcatalog: document.getElementById('entireBackcatalog'),
        backcatalogSince: document.getElementById('backcatalogSince'),
        sinceDate: document.getElementById('sinceDate'),
        linkInput: document.getElementById('linkInput'),
        form: document.getElementById('mainForm'),
        result: document.getElementById('result'),
        resetBtn: document.getElementById('resetBtn'),
      };

      if (Object.values(els).some((el) => !el)) {
        console.error('Link Subscriber: missing one or more required elements. Check IDs.');
        return;
      }

      // The two backcatalog checkboxes are mutually exclusive. Every place that
      // can change one of them goes through selectBackcatalogOption() below, so
      // there is exactly one spot in the code responsible for that rule.
      const backcatalogOptions = [els.entireBackcatalog, els.backcatalogSince];

      function formatDDMMYY(date) {
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yy = String(date.getFullYear()).slice(-2);
        return `${dd}.${mm}.${yy}`;
      }

      function isValidDate(value) {
        return /^\d{2}\.\d{2}\.\d{2}$/.test(value);
      }

      function isValidYoutubeUrl(value) {
        try {
          const host = new URL(value).hostname.replace(/^www\./, '');
          return host === 'youtube.com' || host === 'm.youtube.com' || host === 'youtu.be';
        } catch {
          return false;
        }
      }

      function setSinceDateVisible(visible) {
        els.sinceDate.style.display = visible ? 'inline-block' : 'none';
        if (visible && !els.sinceDate.value) {
          els.sinceDate.value = formatDDMMYY(new Date());
        }
      }

      // Selecting one backcatalog option always clears the other - there is no
      // path through this function that can leave both checked.
      function selectBackcatalogOption(chosen) {
        backcatalogOptions.forEach((cb) => {
          cb.checked = cb === chosen;
        });
        setSinceDateVisible(chosen === els.backcatalogSince);
      }

      function clearBackcatalogOptions() {
        backcatalogOptions.forEach((cb) => (cb.checked = false));
        setSinceDateVisible(false);
      }

      function showResult(text) {
        els.result.style.display = 'block';
        els.result.textContent = text;
      }

      function submitJob(payload) {
        fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
          .then((r) => r.json())
          .then((json) => {
            if (json.ok) {
              showResult('Job started, pid: ' + json.pid);
            } else {
              showResult('Error: ' + (json.error || 'unknown'));
            }
          })
          .catch((err) => showResult('Network error: ' + err.message));
      }

      els.subscribe.addEventListener('change', () => {
        els.subOptions.style.display = els.subscribe.checked ? 'flex' : 'none';
        if (!els.subscribe.checked) clearBackcatalogOptions();
      });

      backcatalogOptions.forEach((cb) => {
        cb.addEventListener('change', () => {
          if (cb.checked) {
            selectBackcatalogOption(cb);
          } else {
            setSinceDateVisible(false);
          }
        });
      });

      els.resetBtn.addEventListener('click', () => {
        els.form.reset();
        els.subOptions.style.display = 'none';
        clearBackcatalogOptions();
        els.result.style.display = 'none';
      });

      els.form.addEventListener('submit', (event) => {
        event.preventDefault();
        els.result.style.display = 'none';

        const link = els.linkInput.value.trim();
        if (!link) {
          showResult('Please enter a link.');
          return;
        }
        if (!isValidYoutubeUrl(link)) {
          showResult('Please enter a valid YouTube URL.');
          return;
        }

        const since = els.backcatalogSince.checked;
        if (since && !isValidDate(els.sinceDate.value.trim())) {
          showResult('Please enter the date in dd.mm.yy format.');
          return;
        }

        submitJob({
          link,
          subscribe: els.subscribe.checked,
          entireBackcatalog: els.entireBackcatalog.checked,
          backcatalogSince: since,
          sinceDate: since ? els.sinceDate.value.trim() : '',
        });
      });

      // Initial state
      els.subOptions.style.display = els.subscribe.checked ? 'flex' : 'none';
      setSinceDateVisible(false);
    });
  </script>
</body>
</html>
